# mosquitto_acl.conf — quién puede publicar y leer qué (topics de core/enlace_mqtt.py).
# Prefijo "scada", planta "<slug>" (por defecto estacion-electroneumatica); el "+" vale para cualquier planta.
# Mosquitto: sin "topic" global antes del primer "user", nadie anónimo tiene acceso a nada.

# El puente del HMI (laboratorio): publica el estado de la planta y lee lo que manda el servidor.
user puente
topic write scada/+/snap
topic write scada/+/evt
topic write scada/+/estado
topic write scada/+/resultado
topic write scada/+/ping
topic read  scada/+/orden
topic read  scada/+/presencia
topic read  scada/+/pong

# El servidor web del gemelo (esta PC): lee la planta y publica órdenes firmadas, presencia y pong.
user gemelo
topic read  scada/+/snap
topic read  scada/+/evt
topic read  scada/+/estado
topic read  scada/+/resultado
topic read  scada/+/ping
topic write scada/+/orden
topic write scada/+/presencia
topic write scada/+/pong
