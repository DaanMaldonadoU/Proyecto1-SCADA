# mosquitto.conf — broker MQTT del gemelo digital (broker.smartsensorslab.com) en la PC servidor Windows.
# Guía: mds/DESPLIEGUE_SERVIDOR.md §4. Copiar sobre  C:\Program Files\mosquitto\mosquitto.conf
# (o pasar con  mosquitto -c <ruta> -v) junto con mosquitto_acl.conf y el archivo de contraseñas.
#
# Usuarios (se crean con mosquitto_passwd, ver la guía):
#   gemelo  -> el servidor web del gemelo, en esta misma PC (lee lo del puente, escribe órdenes)
#   puente  -> el puente del HMI en el laboratorio (escribe snapshots, lee órdenes)
# Los mensajes además van sellados con HMAC de puente.clave (core/enlace_mqtt.py): el broker solo transporta.

per_listener_settings false
allow_anonymous false
password_file C:\Program Files\mosquitto\passwd
acl_file C:\Program Files\mosquitto\mosquitto_acl.conf

# Sin persistencia a disco: lo único retenido (estado y presencia) se vuelve a publicar solo al reconectar.
persistence false
log_dest file C:\Program Files\mosquitto\mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true

# Límites razonables para un snapshot de ~3 KB a 20 Hz.
max_packet_size 1048576
max_inflight_messages 50
max_queued_messages 200

# 1) Solo esta PC (el servidor web del gemelo):  mqtt://gemelo:CLAVE@127.0.0.1:1883
listener 1883 127.0.0.1
protocol mqtt

# 2) MQTT sobre WebSocket, solo local: lo publica Caddy (o cloudflared) como wss://broker.smartsensorslab.com
#    El puente del laboratorio usa  mqtt+wss://puente:CLAVE@broker.smartsensorslab.com
listener 9001 127.0.0.1
protocol websockets

# 3) OPCIONAL: MQTT con TLS directo (mqtts://…:8883). Hace falta abrir el 8883 y darle los certificados
#    del dominio (los de Caddy están en %AppData%\Caddy\certificates\...\broker.smartsensorslab.com\).
#    Descomentar y ajustar rutas:
# listener 8883 0.0.0.0
# protocol mqtt
# certfile C:\Program Files\mosquitto\certs\broker.smartsensorslab.com.crt
# keyfile  C:\Program Files\mosquitto\certs\broker.smartsensorslab.com.key
